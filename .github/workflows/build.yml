Name: Build QUANTOM OS (Beta) by Pixel

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso p7zip-full

      - name: Configure Debian Live System
        run: |
          mkdir -p build && cd build
          lb config \
            --distribution bookworm \
            --architecture amd64 \
            --bootloader grub-efi \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian/"

      - name: Add XFCE Desktop, Apps & Themes
        run: |
          cd build
          mkdir -p config/package-lists
          echo "task-xfce-desktop plymouth plymouth-themes papirus-icon-theme pipewire pinta libreoffice gimp vlc" > config/package-lists/quantom.list.chroot

      - name: Apply QUANTOM OS Branding
        run: |
          cd build
          mkdir -p config/includes.chroot/etc
          cat << 'EOF' > config/includes.chroot/etc/os-release
          NAME="QUANTOM OS"
          VERSION="1.0 Beta"
          ID=quantom
          PRETTY_NAME="QUANTOM OS 1.0 Beta (Pixel Inc.)"
          BUILD_ID="Pixel-Quantom-Beta"
          EOF

      - name: Build ISO Image
        run: |
          cd build
          sudo lb build

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QUANTOM-OS-Beta-Pixel-ISO
          path: build/*.iso
          if-no-files-found: error
