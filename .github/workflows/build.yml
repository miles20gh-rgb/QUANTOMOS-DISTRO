name: Build QUANTOM OS (Beta) by Pixel

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso wget git

      - name: Configure Base Live System
        run: |
          mkdir build && cd build
          # Configure Debian with XFCE Desktop, Plymouth (Boot Splash), and Sound Support
          lb config \
            --architectures amd64 \
            --bootloader grub-efi \
            --desktop xfce \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootappend-live "boot=live components quiet splash plymouth.ignore-serial-consoles"

      - name: Add Packages to Package List
        run: |
          cd build
          mkdir -p config/package-lists
          echo "plymouth plymouth-themes xfce4-goodies papirus-icon-theme pulseaudio sox libcanberra-gtk3-module" > config/package-lists/quantom.list.chroot

      - name: Inject Neon Customisations (Icons, Sounds & OS Info)
        run: |
          cd build
          
          # 1. Create OS Release Branding (QUANTOM OS Beta by Pixel)
          mkdir -p config/includes.chroot/etc
          cat << 'EOF' > config/includes.chroot/etc/os-release
          NAME="QUANTOM OS"
          VERSION="1.0 Beta"
          ID=quantom
          PRETTY_NAME="QUANTOM OS 1.0 Beta (Pixel Inc.)"
          HOME_URL="https://github.com"
          SUPPORT_URL="https://github.com"
          BUG_REPORT_URL="https://github.com"
          BUILD_ID="Pixel-Quantom-Beta"
          EOF

          # 2. Add Neon Icons (Candy / BeautyLine Theme)
          mkdir -p config/includes.chroot/usr/share/icons
          git clone https://github.com/EliverLara/Candy-icons.git config/includes.chroot/usr/share/icons/Candy-icons

          # 3. Add Custom Neon Sound & Auto-Start Sound Script
          mkdir -p config/includes.chroot/usr/share/sounds/quantom
          mkdir -p config/includes.chroot/etc/xdg/autostart
          
          # Create a synthesized Cyberpunk Startup Chime
          sox -n -r 44100 config/includes.chroot/usr/share/sounds/quantom/startup.wav synth 1.5 synth sine 220-880 fade q 0.1 1.5 0.5
          
          # Create Autostart Entry for Startup Sound
          cat << 'EOF' > config/includes.chroot/etc/xdg/autostart/quantom-sound.desktop
          [Desktop Entry]
          Type=Application
          Name=Quantom Startup Sound
          Exec=paplay /usr/share/sounds/quantom/startup.wav
          OnlyShowIn=XFCE;
          RunHook=0
          EOF

          # 4. Set Default XFCE Theme to Dark & Neon Icons
          mkdir -p config/includes.chroot/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml
          cat << 'EOF' > config/includes.chroot/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xsettings" version="1.0">
            <property name="Net" type="empty">
              <property name="ThemeName" type="string" value="Adwaita-dark"/>
              <property name="IconThemeName" type="string" value="Candy-icons"/>
            </property>
          </channel>
          EOF

      - name: Build QUANTOM OS ISO
        run: |
          cd build
          sudo lb build

      - name: Rename and Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: QUANTOM-OS-Beta-Pixel.iso
          path: build/*.iso
